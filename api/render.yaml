services:
  - type: web
    name: ilac-rehberi-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATA_DIR
        value: /tmp/ilac-rehberi

